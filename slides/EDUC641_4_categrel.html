# Goals of the unit

- Describe relationships between quantitative data that are categorical
- Quantify the magnitude of a relationship between two dichotomous variables using a risk difference and a risk ratio.
- Calculate an index of the strength of the relationship between two categorical variables, the chi-squared ( `\(\chi^2\)`) statistic
- Write R scripts to conduct these analyses
- Formulate and describe the purpose of a null hypothesis
- Conceptually describe the criteria to make a statistical inference from a sample to a population
- Interpret and report the results of a contingency-table analysis and a statistical inference from a chi-squared statistic

---
## Reminder of motivating question


.blue[**Were convicted murderers more likely to be sentenced to death in Georgia if they killed someone Black or if they killed someone white?**]

## Two ways to say "how different"

.pull-left[
  .red-pink[**Risk Difference (RD):**] *absolute* comparison
  `$$RD = p_{W\_vic} - p_{B\_vic} = 10.94\% - 1.53\% = 9.4 \text{ pp}$$`
  &gt; Convicted murderers of white victims were sentenced to death at a rate **9.4 percentage points higher** than murderers of Black victims.
  ]

.pull-right[
  .red-pink[**Risk Ratio (RR):**] *relative* comparison
  `$$RR = \frac{p_{W\_vic}}{p_{B\_vic}} = \frac{10.94\%}{1.53\%} = 7.2 \text{ times}$$`
  
  &gt; Murderers of white victims were sentenced to death at **7.2 times** the rate of murderers of Black victims.
  ]


.small[*"Risk" is borrowed from epidemiology: the proportion of a group experiencing an outcome. Here "rate" may be the better word.*]
  
--

This is our first introduction to a way of quantifying differences called an .red-pink[**effect size**]. Risk ratios measure the magnitude of the difference on a ***common, comparable scale***.

--
It says **nothing** about whether one variable ***affects*** (causes) the other! More to come...

For that we will use this statistic to conduct a `\(\chi^2\)` .red-pink[**test of independence**].

# Statistical inference

Let's take a step back to capture the nature of the problem
- We've looked at some data on some convicted murderers in the state of Georgia
- We're not interested in only *these* murderers, but we're interested in a broader *population* of murderers from which our *sample* was drawn
  + In fact, even if we could observe outcomes for all murderers in the state of Georgia, our observation of them is imperfect due to *measurement error* and so we only ever observe samples, never the full .red-pink[**"super population"**] (more on this later)
- Is there something about sampling from a population that could resolve our problem?
- Is there some way to generalize our conclusions about our *sample* relationship between *DEATHPEN* and *RVICTIM* to the *underlying population*?
  + This is called .red-pink[**statistical inference**] and it is ***the*** critical contribution of quantitative methods to research

---
# Sampling idiosyncrasy

#### When you generalize from a sample back to its underlying population, you must be careful that your empirical study has not been the victim of *sampling idiosyncrasy*

--

&gt; Take, for example, the case of sampling from a large college class to estimate the average height and (by sheer luck) drawing only the starting 5 players on the basketball team.

--

#### Is the following scenario plausible?
- There really is no relationship between *DEATHPEN* and *RVICTIM* **in the population**
- By accident, we have drawn an idiosyncratic sample from the population
- This sampling idiosyncrasy ended up giving us a `\(\chi^2\)` statistic as large as 103.8 by pure accident

#### How can we assess the plausibility of this scenario? 

---
# The Null Hypothesis `\((H_{0})\)`

.small[We start by imagining a hypothetical world in which there is **no relationship** between *DEATHPEN* and *RVICTIM* in a true population of convicted murderers. Then, we imagine drawing a series of samples of convicted murderers over and over again (say...10,000 times) from this hypothetical population. What values of the] `\(\chi^2\)` .small[statistic might we observe?]

&lt;img src="null_pop.jpg" alt="" width="70%" style="display: block; margin: auto;" /&gt;

---
# Testing the null

In this hypothetical example of repeated sampling from a null population, we could record all 10,000 values of the `\(\chi^2\)` statistic
&lt;img src="EDUC641_4_categrel_files/figure-html/unnamed-chunk-18-1.svg" alt="" style="display: block; margin: auto;" /&gt;

The histogram summarizes the natural variation that could occur in a `\(\chi^2\)` statistic due to ***random sampling idiosyncrasy***, after drawing repeated samples from a hypothetical population in which there is no relationship between *DEATHPEN* and *RVICTIM*.

---

In this hypothetical example of repeated sampling from a null population, we could record all 10,000 values of the `\(\chi^2\)` statistic

.blue[*If this were the histogram that could result from sampling idiosyncrasy, and this were the value of the chi-square statistic, what would you think?*]

# Testing the null

In fact, this is the value of the `\(\chi^2\)` statistic we observed:
&lt;img src="EDUC641_4_categrel_files/figure-html/unnamed-chunk-20-1.svg" alt="" style="display: block; margin: auto;" /&gt;

--

.small[.blue[*This is a histogram of possible chi-square values that could result from sampling idiosyncrasy, and the actual value of the chi-squared statistic in our sample. What do you think?*]]

*WOOHOO!* In this thought exercise, you've just engaged in a rudimentary version of .red-pink[**Null-Hypothesis Significance Testing (NHST)**]; the bedrock of most social science research.

---
# Testing the null (*p*-values)

In fact, we don't need to examine the full histogram. Instead, we can say that in a hypothetical exercise of sampling repeatedly from a null population, less than 1 in a 1,000,000,000,000,000 (a quadrillion) of all accidental values of the `\(\chi^2\)` statistic are larger than a value of 103.8

&lt;img src="EDUC641_4_categrel_files/figure-html/unnamed-chunk-21-1.svg" alt="" style="display: block; margin: auto;" /&gt;

--

The statistic that captures the probability of observing a `\(\chi^2\)` statistic at least as large as what we observed, in the presence of a null population, is called the .red-pink[***p*-value**].


---
# Testing the null (*p*-values)

.blue[*At what p-value would you start to believe that the value of the*] `\(\color{blue}{\chi^2}\)` .blue[*statistic in your own research was "big" (i.e., was unlikely to have occurred by accident)?*]
&lt;img src="EDUC641_4_categrel_files/figure-html/unnamed-chunk-22-1.svg" alt="" style="display: block; margin: auto;" /&gt;

---
# Testing the null (*p*-values)

.blue[*At what p-value would you start to believe that the value of the*] `\(\color{blue}{\chi^2}\)` .blue[*statistic in your own research was "big" (i.e., was unlikely to have occurred by accident)?*]
&lt;img src="EDUC641_4_categrel_files/figure-html/unnamed-chunk-23-1.svg" alt="" style="display: block; margin: auto;" /&gt;

--

.small[In social science research, it is customary to set that threshold at **5 percent (*p*&lt;0.05)**. I.e., if there were no relationship *in the population*, such a difference between our observed and expected data would have happened in fewer than 1 out of 20 randomly drawn samples. When that happens, we *reject the null hypothesis* and describe the relationship as *statistically significant*.]

---
# Testing the null (*p*-values)

*In social science research, it is customary to (arbitrarily) set an alpha-threshold and conduct a Null-Hypothesis Significance Test.*

.tiny[**Report both.** A test statistic tells readers how confident to be that a relationship exists in the population; the risk difference and risk ratio tell them how much it matters. A trivial difference can be "significant" in a huge sample (or one with minimal variance), and an important one can be "non-significant" in a small sample (or one with substantial variance).]

# Putting it all together

### Basic steps of classical statistical inference
1. State a research question, including a null hypothesis `\((H_{0})\)` which states there exists no relationship between our variables of interest, ***on average in the population***
2. Display and describe the observed data
3. Summarize the observed data in relationship to an expected value
4. Set a threshold at which we will no longer believe that the discrepancy between the observed and expected relationship is due to sampling idiosyncrasy
5. Estimate the *p*-value
6. Reject or fail to reject the null hypothesis
7. Quantify the magnitude of the relationship (RD and RR), not just whether one exists
8. Interpret your findings drawing explicitly on plots, summary statistics and test statistics
